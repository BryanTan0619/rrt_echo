<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRT-ECHO Hypergraph</title>
<style>
:root {
  --surface: #fcfcfb; --panel: #ffffff; --border: #e4e3df; --grid: #efeee9;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #8a8983;
  --ev: #2a78d6; --ev-light-stroke: #9ec5f4; --now: #eb6834; --obj: #fff1dc; --obj-stroke: #c27a12; --merge: #7a4fd0;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink);
       font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.wrap { padding: 12px 16px 10px; display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; gap: 8px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-size: 17px; margin: 0; font-weight: 650; }
.sub { color: var(--ink-2); font-size: 12.5px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.controls select, .controls button { font: inherit; border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 2px 6px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 10px; background: #fff; cursor: pointer; }
.seg button.on { background: var(--ink); color: #fff; }
.main { display: grid; grid-template-columns: 460px 1fr; gap: 12px; min-height: 0; }
.left { display: grid; grid-template-rows: auto 1fr; gap: 10px; min-height: 0; }
.videobox { position: relative; background: #111; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; }
.videobox video { width: 100%; height: 100%; object-fit: contain; display: block; cursor: pointer; }
.videobox .novideo { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; font-size: 13px; }
.videobox .novideo[hidden] { display: none; }
.canvas { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; position: relative; min-height: 0; }
.canvas svg { width: 100%; height: 100%; display: block; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow: auto; min-height: 0; }
.panel h2 { font-size: 15.5px; margin: 0 0 2px; word-break: break-all; }
.panel h3 { font-size: 12.5px; color: var(--ink-3); font-weight: 600; margin: 14px 0 6px; }
.muted { color: var(--ink-3); }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--ink-2); margin: 0 4px 4px 0; }
.chip.merge { border-color: #cdbdf0; color: var(--merge); }
.faces { display: flex; flex-wrap: wrap; gap: 5px; }
.faces img { width: 52px; height: 52px; border-radius: 7px; object-fit: cover; border: 1px solid var(--border); }
.member { border: 1px solid var(--grid); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; }
.member .mh { font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
.row { display: grid; grid-template-columns: 78px 1fr auto; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--grid); font-size: 13px; align-items: baseline; }
.row .k { color: var(--ink-3); overflow-wrap: anywhere; }
.row .t { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
.row.future { opacity: .4; }
.row.link { cursor: pointer; } .row.link:hover { background: #f5f4f1; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--grid); cursor: pointer; border-radius: 6px; }
.tl li:hover { background: #f5f4f1; }
.tl li.future { opacity: .4; }
.tl li.now .time { color: var(--now); font-weight: 600; }
.tl .time { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12.5px; }
.tl .what { font-size: 13px; }
.tl .role { font-size: 11.5px; color: var(--ink-3); }
.flag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: #efe9fb; color: var(--merge); margin: 2px 4px 0 0; }
.note { font-size: 12.5px; color: var(--ink-2); background: #fbf7ee; border: 1px solid #efe3c4; border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
.note p { margin: 0 0 4px; } .note p:last-child { margin: 0; }
.divider { list-style: none; text-align: center; color: var(--now); font-size: 12px; font-weight: 600; padding: 3px 0; border-bottom: 1px dashed var(--now) !important; cursor: default !important; display: block !important; }
.timebar { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; display: grid;
           grid-template-columns: auto auto auto 1fr auto; gap: 12px; align-items: center; }
.timebar button { font: inherit; border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 4px 12px; cursor: pointer; }
.clock { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; min-width: 56px; }
.track { position: relative; height: 34px; }
.track input { position: absolute; left: 0; right: 0; top: 4px; width: 100%; margin: 0; accent-color: var(--ev); z-index: 1; }
.band { position: absolute; top: 7px; height: 12px; background: rgba(138,137,131,.16); border-left: 2px solid var(--ink-3); border-radius: 2px; pointer-events: none; z-index: 0; }
.hA { position: absolute; top: 1px; width: 9px; height: 22px; margin-left: -4px; background: #fff; border: 1.5px solid var(--ink-2); border-radius: 3px; cursor: ew-resize; z-index: 2; touch-action: none; }
.hA::after { content: ''; position: absolute; left: 2px; top: 5px; width: 1px; height: 10px; background: var(--ink-3); box-shadow: 2px 0 0 var(--ink-3); }
.controls input[type=range].mini { width: 100px; vertical-align: middle; accent-color: var(--ev); margin: 0 2px; }
.controls input[type=range].w { width: 150px; }
.mono { font-variant-numeric: tabular-nums; display: inline-block; min-width: 40px; }
.ticks { position: absolute; left: 0; right: 0; top: 24px; height: 10px; }
.ticks span { position: absolute; width: 2px; height: 8px; background: var(--ev-light-stroke); transform: translateX(-1px); border-radius: 1px; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.sw { display: inline-block; width: 18px; height: 12px; border-radius: 6px; vertical-align: -1px; margin-right: 5px; }
.bubble-label { font-size: 11.5px; font-weight: 500; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.ev-pred { font-size: 11px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.hull { pointer-events: none; }
.ev-time { font-size: 9px; font-variant-numeric: tabular-nums; pointer-events: none; }
.role-label { font-size: 9.5px; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.sw.ring { width: 14px; height: 14px; border-radius: 50%; }
.node-label { font-size: 12px; font-weight: 600; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.node-sub { font-size: 10.5px; fill: var(--ink-3); paint-order: stroke; stroke: #fff; stroke-width: 3px; pointer-events: none; }
.chipc { font-size: 10.5px; pointer-events: none; }
.qaback { font-size: 12.5px; color: var(--ev); cursor: pointer; margin-bottom: 8px; }
.qrow { border: 1px solid var(--grid); border-radius: 8px; padding: 6px 9px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
.qrow:hover, .qrow.on { background: #f5f4f1; } .qrow.on { border-color: var(--ink-2); }
.qrow .qh { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--ink-3); margin-bottom: 2px; }
.ok { color: #1b8a5a; font-weight: 700; } .bad { color: #c62828; font-weight: 700; }
.opt { display: grid; grid-template-columns: 36px 1fr; gap: 6px; padding: 3px 0; font-size: 13px; border-bottom: 1px solid var(--grid); }
.opt .lt { font-weight: 700; color: var(--ink-3); } .opt.gold .lt { color: #1b8a5a; } .opt.pick { background: #fff7e8; }
.opt .cf { font-size: 11.5px; color: var(--ink-3); }
.bd { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 6px; border: 1px solid var(--border); color: var(--ink-2); margin-left: 3px; vertical-align: 1px; }
.bd.q { border-color: #0b0b0b; color: #0b0b0b; } .bd.ch { background: #0b0b0b; color: #fff; border-color: #0b0b0b; }
.qf { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--grid); border-radius: 6px; font-size: 13px; }
.qf.link { cursor: pointer; } .qf.link:hover { background: #f5f4f1; } .qf .time { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12.5px; }
.qf .k { color: var(--ink-3); font-size: 11.5px; }
.qtx { padding: 5px 4px; border-bottom: 1px solid var(--grid); font-size: 12.5px; }
.qtx.sup { border-left: 3px solid #1b8a5a; padding-left: 7px; } .qtx.ins { border-left: 3px solid #d9a21f; padding-left: 7px; } .qtx.con { border-left: 3px solid #c62828; padding-left: 7px; }
.qticks { position: absolute; left: 0; right: 0; top: 22px; height: 12px; pointer-events: none; z-index: 1; }
.qticks span { position: absolute; width: 3px; height: 12px; background: #c9367a; transform: translateX(-1.5px); border-radius: 1px; }
.qticks span.ch { background: #0b0b0b; }
.sp { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 9px; border: 1px solid #b8d4f5; background: #f2f7fe; color: #1a5fb4; cursor: pointer; margin: 0 3px 2px 0; font-variant-numeric: tabular-nums; }
.sp:hover { background: #dbe8f8; } .sp.on { background: #1a5fb4; color: #fff; border-color: #1a5fb4; }
.sp.gold { border-color: #9fd3b4; background: #f1faf4; color: #1b6b45; } .sp.gold:hover { background: #dff0e6; }
.spnote { font-size: 12px; color: var(--ink-2); background: #f5f4f1; border-radius: 6px; padding: 5px 8px; margin: 4px 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>RRT-ECHO Hypergraph</h1>
    <span class="sub" id="sub"></span>
  </div>
  <div class="controls">
    <label>Run <select id="runSel"></select></label>
    <span class="seg" id="viewSeg"></span>
    <span>Layout <span class="seg" id="modeSeg"><button data-m="event" class="on">one ring per event</button><button data-m="group">one ring per participant set</button></span></span>
    <label><input type="checkbox" id="singles"> also draw single-member events</label>
    <label>not-yet opacity <input type="range" id="futureOp" min="0" max="100" value="0" class="mini"> <span id="futureOpV" class="mono">0%</span></label>
    <label>past fade <input type="range" id="fadeStr" min="0" max="100" value="70" class="mini"> <span id="fadeStrV" class="mono">70%</span></label>
    <span id="qaBox" hidden>QA trace <span class="seg" id="qaSeg"><button data-q="off" class="on">off</button><button data-q="on">on</button></span></span>
    <label>look-back window <input type="range" id="winSize" min="0" max="1000" value="1000" class="mini w"> <span id="winSizeV" class="mono">all</span></label>
    <span>labels beside rings <span class="seg" id="labelSeg"><button data-l="now" class="on">now + selected</button><button data-l="all">all</button></span></span>
  </div>

  <div class="main">
    <div class="left">
      <div class="videobox"><video id="video" preload="auto" playsinline muted></video><div class="novideo" id="novideo" hidden>no preview video for this run</div></div>
      <div class="panel" id="panel"></div>
    </div>
    <div class="canvas" id="canvas"><svg id="svg"></svg></div>
  </div>

  <div class="timebar">
    <button id="play">▶ play</button>
    <button id="mute" title="sound">muted</button>
    <div class="clock" id="clock">0:00</div>
    <div class="track" id="track">
      <div class="band" id="band"></div>
      <input type="range" id="slider" step="0.5">
      <div class="hA" id="hA" title="look-back window start: drag to resize"></div>
      <div class="ticks" id="ticks"></div>
      <div class="qticks" id="qticks"></div>
    </div>
    <div class="legend">
      <span><span style="display:inline-block;width:10px;height:10px;background:#2a78d6;transform:rotate(45deg);margin-right:6px"></span>event (diamond)</span>
      <span><i class="sw" style="background:rgba(42,120,214,.12);border:1.5px solid #2a78d6;border-radius:50%"></i>one colour = one hyperedge</span>
      <span><i class="sw" style="background:rgba(235,104,52,.15);border:2.5px solid var(--now);border-radius:8px"></i>happening now</span>
      <span><i class="sw" style="background:#e8e7e4;border:1.5px solid #9a9994;border-radius:8px;opacity:.5"></i>past, older = more transparent</span>
      <span><i class="sw" style="border:1.5px dashed #9ec5f4;border-radius:8px"></i>not yet</span>
      <span><i class="sw ring" style="background:#fff;border:1.5px solid var(--ink-2)"></i>person (black edge, big circle)</span>
      <span><i class="sw ring" style="background:var(--obj);border:2.5px solid var(--obj-stroke)"></i>object (orange edge, small circle)</span>
      <span>— line = role binding, role written on it</span>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
const span = (a, b) => `${mmss(a)}–${mmss(b)}`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const VIEW_NAME = { graph: 'hypergraph.json', after: 'after offline merge', after_av: 'after merge + face/voice', before: 'before merge (as written)' };

let D = null, V = null, viewKey = null, ents = new Map();
let T = 0, selected = null, showSingles = false, mode = 'event', labelMode = 'now', shownSig = null;
// Not-yet events are hidden by default (opacity 0); the canvas grows with the visible node count
// and auto-fits on the first picture; while playing, the view follows the event happening now.
let futureOp = 0, fadeStr = 0.7, WIN = Infinity, needFit = true, lastNowKey = null, LW = 800, LH = 600, lastVis = new Map();
// QA trace: runs/<name>/qa.json is produced by build_qa.py from the reader's results.json.
// With QA trace on and a question selected, only the facts the reader was shown are drawn
// (event -> diamond/ring; the owner of a text/state fact -> highlighted person/object node);
// everything else is hidden and the time window is ignored (the reader sees the whole memory).
// Facts cited by the audit get a thick border; facts pulled in only by an option (not the stem) get a dashed border.
let QA = null, qaOn = false, qaQ = null, qaF = new Map(), qaOwn = new Set(), qaSpan = null;
// Gold-span trace: qa.json's annotation comes from the question-set provenance (gold evidence span,
// each distractor's own time, query/bridge events). Clicking a time chip sets qaSpan, switching the
// graph to "what the memory actually recorded during that span" (not what the reader retrieved).
const ovl = (b, sp) => b.intervals.some(([s, e]) => e >= sp.a - 0.5 && s <= sp.b + 0.5);
const qaShow = b => qaSpan ? ovl(b, qaSpan) : b.events.some(e => qaF.has(e.id));
const inQA = b => !!qaQ && qaShow(b);
const qaChain = d => !!qaQ && d.b.events.some(e => qaF.has(e.id) && qaF.get(e.id).chain);
const qaOpt = d => !!qaQ && d.b.events.every(e => !qaF.has(e.id) || !qaF.get(e.id).in.includes('stem'));
const qaCur = () => QA && qaQ ? QA.questions.find(q => q.id === qaQ) : null;
function setQ(id) {   // pick a question: rebuild the retrieved-fact index, redraw (single-member events among them get drawn too), refit
  qaQ = id; qaF = new Map(); qaOwn = new Set(); qaSpan = null;
  const q = qaCur();
  if (q) q.facts.forEach(f => { qaF.set(f.id, f); if (f.kind !== 'event') f.members.forEach(m => qaOwn.add(m)); });
  $('qticks').innerHTML = q ? q.facts.filter(f => f.t0 != null).map(f => `<span class="${f.chain ? 'ch' : ''}" style="left:${(f.t0 - D.t0) / (D.t1 - D.t0) * 100}%" title="${esc(f.pred || f.value || '')}"></span>`).join('') : '';
  selected = null; userZoomed = false; shownSig = null; render();
}
function qaSegSet(v) { qaOn = v === 'on'; $('qaSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.q === v)); if (!qaOn) { qaQ = null; qaF = new Map(); qaOwn = new Set(); qaSpan = null; $('qticks').innerHTML = ''; } }
function setSpan(a, b) {   // gold span: switch the graph to what the memory recorded in this span, jump to its start
  qaSpan = { a, b }; selected = null; userZoomed = false; shownSig = null; jumpAt(a); render();
}
// Look-back window [A, T], A = T − WIN (WIN set by the look-back slider; drag the A handle on the
// time bar to resize while paused). Events inside the window fade from blue to gray by (T − end)/(T − A)
// with opacity 100% → 30%; events before A are not drawn; not-yet events follow the opacity slider (default 0);
// a selected person/event stays fully lit (even before A); not-yet still follows the slider.
const winStart = () => Math.max(D.t0, T - WIN);
const GRAY = '#9a9994', toGray = () => '#2a78d6', fillGray = () => '#dbe8f8', inkGray = () => '#0b0b0b';   // past keeps its colour (was: blend to gray)
function vis(b) {   // how one event shows under the window: a = opacity, f = 0 (fresh, blue) … 1 (old, gray), s = state
  const s = state(b);
  if (s === 'future') return { a: futureOp, f: 0, s };
  if (s === 'now') return { a: 1, f: 0, s };
  const end = d3.max(b.intervals, iv => iv[1]), A = winStart();
  if (end < A) return { a: 0, f: 1, s: 'gone' };
  const f = clamp((T - end) / Math.max(1, T - A), 0, 1);
  return { a: 1 - fadeStr * f, f, s };   // past keeps its colour, only fades by age (past-fade slider, 0 = never)
}
const DUR = () => Math.max(20, D.t1 - D.t0);
const wFromSlider = v => v >= 1000 ? Infinity : 10 * Math.pow(DUR() / 10, v / 1000);   // log scale 10 s … whole run
const sliderFromW = w => !isFinite(w) || w >= DUR() ? 1000 : Math.round(1000 * Math.log(Math.max(10, w) / 10) / Math.log(DUR() / 10));
const fmtW = w => !isFinite(w) || w >= DUR() ? 'all' : (w < 60 ? `${Math.round(w)}s` : `${Math.floor(w / 60)}m ${String(Math.round(w % 60)).padStart(2, '0')}s`);
function setW(w, fromSlider = false) {
  WIN = w; if (!fromSlider) $('winSize').value = sliderFromW(w);
  $('winSizeV').textContent = fmtW(w); shownSig = null; restyle();
}
function updateTrack() {   // gray band = the window [A, T]; ticks take the colour of their event
  const A = winStart(), span = D.t1 - D.t0, pct = t => (t - D.t0) / span * 100;
  $('band').style.left = pct(A) + '%'; $('band').style.width = Math.max(0, pct(T) - pct(A)) + '%';
  $('hA').style.left = pct(A) + '%';
  $('ticks').querySelectorAll('span').forEach(el => {
    const s0 = +el.dataset.s, e0 = +el.dataset.e;
    el.style.background = (s0 <= T && T <= e0) ? 'var(--now)' : (e0 < T ? (e0 < A ? '#e4e3df' : toGray(clamp((T - e0) / Math.max(1, T - A), 0, 1))) : 'var(--ev-light-stroke)');
  });
}
const video = $('video'), slider = $('slider');
let pos = new Map();   // node positions per run, shared by both views so before/after line up

// ---------- data / view ----------
async function init() {
  const idx = await (await fetch('runs/index.json', { cache: 'no-store' })).json();
  $('runSel').innerHTML = idx.map(r => `<option value="${esc(r.name)}">${esc(r.name)}（${mmss(r.t0)}–${mmss(r.t1)}）</option>`).join('');
  const want = new URLSearchParams(location.search).get('run');
  const name = idx.some(r => r.name === want) ? want : idx[idx.length - 1].name;
  $('runSel').value = name;
  $('runSel').onchange = () => loadRun($('runSel').value);
  await loadRun(name);
}
async function loadRun(name) {
  D = await (await fetch(`runs/${encodeURIComponent(name)}/data.json`, { cache: 'no-store' })).json();
  history.replaceState(null, '', `?run=${encodeURIComponent(name)}`);
  pos = new Map();
  userZoomed = false;
  $('sub').textContent = `${mmss(D.t0)}–${mmss(D.t1)} · window ${D.window}s · data: ${D.source}`;
  $('viewSeg').innerHTML = Object.keys(D.views).sort().map(v => `<button data-v="${v}">${VIEW_NAME[v]}</button>`).join('');
  $('viewSeg').querySelectorAll('button').forEach(b => b.onclick = () => setView(b.dataset.v));
  video.pause();
  video.innerHTML = '';
  video.removeAttribute('src');
  if (D.video) {
    const base = `runs/${encodeURIComponent(name)}/`;
    video.innerHTML = `<source src="${base}${D.video}" type="video/mp4">` + (D.video_webm ? `<source src="${base}${D.video_webm}" type="video/webm">` : '');
    video.load(); $('novideo').hidden = true;
    // data declares a video but the file is absent (e.g. the bundled demo has no video): say where to put it
    video.querySelectorAll('source').forEach(src => src.onerror = () => {
      if (video.networkState === 3) { $('novideo').textContent = `preview video not found: put the source at runs/${name}/segment.mp4`; $('novideo').hidden = false; }
    });
  } else $('novideo').hidden = false;
  slider.min = D.t0; slider.max = D.t1; T = D.t0; slider.value = T;
  $('winSize').value = sliderFromW(WIN); $('winSizeV').textContent = fmtW(WIN);
  QA = null; qaSegSet('off');

    if (e.kind === 'person') {
      const pairTable = e.pairs.length ? `<h3>pairwise face scores (pre-merge; threshold 0.38)</h3>${e.pairs.map(p => `<div class="row"><span class="k">${esc(p.a)}</span><span>${esc(p.b)}</span><span class="t">${p.score == null ? '—' : p.score.toFixed(3)}</span></div>`).join('')}` : '';
      head = `<div><span class="chip">person</span>${e.members.length > 1 ? `<span class="chip merge">linked from ${e.members.length} local instances</span>` : ''}${e.unresolved_mention ? '<span class="chip">unresolved mention</span>' : ''}</div>
        <h3>${e.members.length > 1 ? "each local instance's own box (to judge whether they are one person)" : 'reference boxes'}</h3>
        ${e.members.map(m => `<div class="member"><div class="mh"><b>${esc(m.id.replace(/^.*:(win_\d+):/, '$1:'))}</b> · ${m.first != null ? mmss(m.first) : '?'}–${m.last != null ? mmss(m.last) : '?'} · ${m.face_embeds} boxes${m.aliases.length ? ' · ' + m.aliases.map(esc).join(' / ') : ''}</div>
          <div class="faces">${m.faces.map(f => `<img src="${f}" alt="">`).join('') || '<span class="muted">no avatar cropped</span>'}</div></div>`).join('')}
        ${pairTable}`;
    } else {
      head = `<div><span class="chip">object</span></div>
        <h3>entity</h3>
        <div class="note"><p>${esc(e.reason)}</p>${e.notes.map(n => `<p>${esc(n)}</p>`).join('')}</div>
        <h3>events it takes part in (${e.occurrences.length})</h3>
        ${e.occurrences.map(o => `<div class="row link ${T < o.start ? 'future' : ''}" data-t="${o.start}"><span class="k">${esc(o.slot)}</span><span>${esc(o.text)} <span class="muted">· ${esc(o.pred)}${o.holder ? ' · ' + esc(o.holder) : ''}</span></span><span class="t">${span(o.start, o.end)}</span></div>`).join('')}`;
    }
    P.innerHTML = `<h2>${esc(e.name)}</h2>${head}
      <h3>attributes & states (facts kind=state / attribute / text with this owner)</h3>${attrs}
      <h3>events it takes part in (${tl.length})</h3>
      <ul class="tl">${withNow(tl, a => `<li class="${cls(a)}" data-t="${a.start}"><span class="time">${span(a.start, a.end)}</span>
        <span class="what">${esc(a.desc || a.pred)}<br><span class="role">${esc(a.roles[e.key] || '')} of ${esc(a.pred)}${a.single ? ' · single-member' : ''}</span> ${flags(a)}</span></li>`)}</ul>`;
    bindPanelClicks(P); P.scrollTop = keep; return;
  }
  const b = bubblesAll().find(x => x.id === selected.id);
  if (!b) { selected = null; return panel(); }
  const nameOf = k => ents.get(k) ? ents.get(k).name : k;
  P.innerHTML = `<h2>${esc(b.members.map(nameOf).join(' · '))}</h2>
    <div>${b.members.map(k => `<span class="chip" data-ent="${esc(k)}" style="cursor:pointer">${esc(nameOf(k))}</span>`).join('')}</div>
    <h3>${b.events.length} events</h3>
    <ul class="tl">${withNow(b.actions, a => {
      const roles = Object.entries(a.roles).map(([k, r]) => `${a.text[k]} (${r})`).join(', ');
      const mm = a.merged_members.length ? `<div class="note">merged in offline: ${a.merged_members.map(m => `${span(m.start, m.end)} ${esc(m.desc)}`).join('; ')}</div>` : '';
      return `<li class="${cls(a)}" data-t="${a.start}"><span class="time">${span(a.start, a.end)}</span>
        <span class="what">${esc(a.desc)}<br><span class="role">${esc(a.pred)} · ${esc(roles)} · ${a.status === 'full' ? 'full write' : 'partial write'} · ${a.evidence} evidence · v${a.version}</span> ${flags(a)}
        ${a.unresolved.length ? `<div class="note">unresolved: ${esc(a.unresolved.map(slotName).join(', '))}</div>` : ''}${mm}</span></li>`;
    })}</ul>`;
  bindPanelClicks(P); P.scrollTop = keep;
}

// ---------- time: one clock for video + graph ----------
let raf = null, timer = null;
function setTime(t, fromVideo = false) {
  T = clamp(t, D.t0, D.t1); slider.value = T;
  if (!fromVideo && D.video && Math.abs(video.currentTime - (T - D.t0)) > 0.25) video.currentTime = T - D.t0;
  restyle();
}
slider.oninput = () => { returnT = null; setTime(+slider.value); };
function follow() {
  const t = D.t0 + video.currentTime;
  if (Math.floor(t * 2) !== Math.floor(T * 2)) setTime(t, true); else { T = t; }
  raf = requestAnimationFrame(follow);
}
video.onplay = () => { $('play').textContent = '❚❚ pause'; cancelAnimationFrame(raf); follow(); };
video.onpause = () => { $('play').textContent = '▶ play'; cancelAnimationFrame(raf); setTime(D.t0 + video.currentTime, true); };
video.onended = video.onpause;
video.onclick = () => $('play').click();
$('play').onclick = () => {
  if (D.video) { if (video.paused) { if (T >= D.t1 - 0.2) setTime(D.t0); video.play(); } else video.pause(); return; }
  if (timer) { clearInterval(timer); timer = null; $('play').textContent = '▶ play'; return; }
  if (T >= D.t1) setTime(D.t0);
  $('play').textContent = '❚❚ pause';
  timer = setInterval(() => { if (T >= D.t1) { $('play').click(); return; } setTime(T + 0.5); }, 500);
};
$('mute').onclick = () => { video.muted = !video.muted; $('mute').textContent = video.muted ? 'muted' : 'sound on'; };
$('labelSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
  labelMode = b.dataset.l; $('labelSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); shownSig = null; restyle(); });
$('singles').onchange = e => { showSingles = e.target.checked; selected = null; userZoomed = false; render(); };
$('modeSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
  mode = b.dataset.m; $('modeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); selected = null; userZoomed = false; render(); });
$('futureOp').oninput = e => { futureOp = +e.target.value / 100; $('futureOpV').textContent = e.target.value + '%'; shownSig = null; restyle(); };
$('winSize').oninput = e => setW(wFromSlider(+e.target.value), true);
$('fadeStr').oninput = e => { fadeStr = +e.target.value / 100; $('fadeStrV').textContent = e.target.value + '%'; shownSig = null; restyle(); };
(() => {   // drag the window-start handle on the time bar: W follows (the size slider updates), the playhead stays put
  const h = $('hA'), tr = $('track'); let on = false;
  h.onpointerdown = ev => { on = true; h.setPointerCapture(ev.pointerId); ev.preventDefault(); };
  h.onpointermove = ev => { if (!on) return; const r = tr.getBoundingClientRect();
    const a = clamp(D.t0 + (ev.clientX - r.left) / r.width * (D.t1 - D.t0), D.t0, Math.max(D.t0, T - 10));
    setW(a <= D.t0 + 0.5 ? Infinity : T - a); };
  h.onpointerup = h.onpointercancel = () => { on = false; };
})();
$('qaSeg').querySelectorAll('button').forEach(b => b.onclick = () => { qaSegSet(b.dataset.q); selected = null; userZoomed = false; render(); });
svg.on('click', () => { selected = null; if (returnT !== null) { const t = returnT; returnT = null; setTime(t); } else restyle(); });
function select(s) { selected = s; restyle(); }
window.addEventListener('resize', () => { if (V) render(); });
init();
</script>
